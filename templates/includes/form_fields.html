{% for error in form.non_field_errors %}
    <div class="alert alert-danger" role="alert">{{ error }}</div>
{% endfor %}
{% for field in form %}
    <div class="mb-3">
        {{ field.label_tag }}
        {{ field }}
        {% if field.help_text %}
            <div class="form-text">{{ field.help_text|safe }}</div>
        {% endif %}
        {% for error in field.errors %}
            <div class="text-danger small">{{ error }}</div>
        {% endfor %}
    </div>
{% endfor %}
