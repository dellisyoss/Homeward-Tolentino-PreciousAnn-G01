<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Homeward{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar bg-white border-bottom" aria-label="Main navigation">
        <div class="container">
            <a class="navbar-brand" href="{% url 'home' %}">Homeward</a>
            {% if not user.is_authenticated %}
                <a class="btn btn-outline-primary btn-sm" href="{% url 'signup' %}">Register</a>
            {% endif %}
        </div>
    </nav>
    <main class="container py-5">
        {% for message in messages %}
            <div class="alert {% if message.tags == 'error' %}alert-danger{% else %}alert-{{ message.tags|default:'info' }}{% endif %}" role="alert">
                {{ message }}
            </div>
        {% endfor %}
        {% block content %}{% endblock %}
    </main>
</body>
</html>
