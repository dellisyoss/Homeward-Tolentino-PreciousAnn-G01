{% extends "base.html" %}

{% block title %}{{ page_title }} | Homeward{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <h1 class="h3 mb-3">{{ page_title }}</h1>
        <p>Clear Active account to disable access while keeping the account's records.</p>
        <form method="post" class="card card-body">
            {% csrf_token %}
            {% include "includes/form_fields.html" %}
            <button type="submit" class="btn btn-primary">Save user</button>
        </form>
        <a class="d-inline-block mt-3" href="{% url 'user_list' %}">Cancel</a>
    </div>
</div>
{% endblock %}
