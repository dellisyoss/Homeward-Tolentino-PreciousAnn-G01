{% extends "base.html" %}
{% block title %}Check your email | Homeward{% endblock %}
{% block content %}
<div class="form-panel">
    <header class="page-heading">
        <h1>Check your email</h1>
        <p class="page-description">If an active account matches the address you entered, we sent a password reset link. Check your spam folder if it does not arrive.</p>
    </header>
    <a class="btn btn-outline-primary" href="{% url 'login' %}">Back to login</a>
</div>
{% endblock %}
