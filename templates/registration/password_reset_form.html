{% extends "base.html" %}
{% block title %}Reset password | Homeward{% endblock %}
{% block content %}
<div class="form-panel">
    <header class="page-heading">
        <h1>Reset password</h1>
        <p class="page-description">Enter the email address you use to log in.</p>
    </header>
    <form method="post" class="card card-body">
        {% csrf_token %}
        {% include "includes/form_fields.html" %}
        <button type="submit" class="btn btn-primary">Send reset link</button>
    </form>
    <p class="form-footer"><a href="{% url 'login' %}">Back to login</a></p>
</div>
{% endblock %}
